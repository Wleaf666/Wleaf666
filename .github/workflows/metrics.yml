name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate 3D Contribution Skyline
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN }}
          user: Wleaf666
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Shanghai

          # -------------------- 纯净 3D 等轴贡献天际线 --------------------
          # 彻底移除 upstream API 变更导致 Unexpected error 的 plugin_achievements 与 plugin_habits
          # 仅保留极其稳定、科技感十足的 3D 提交天际线，作为 README 下方的极客视觉锚点
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
